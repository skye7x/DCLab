
name: Deploy Next.js site to Pages

on:
  push:
    branches:
      - main
    paths:
      - "dclab-web/**"
      - ".github/workflows/nextjs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dclab-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect package manager
        id: package-manager
        run: |
          if [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "runner=npx --no-install" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "runner=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "No package-lock.json or yarn.lock found."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ steps.package-manager.outputs.manager }}
          cache-dependency-path: dclab-web/${{ steps.package-manager.outputs.manager == 'yarn' && 'yarn.lock' || 'package-lock.json' }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: dclab-web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('dclab-web/package-lock.json', 'dclab-web/yarn.lock') }}-${{ hashFiles('dclab-web/**/*.js', 'dclab-web/**/*.jsx', 'dclab-web/**/*.ts', 'dclab-web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('dclab-web/package-lock.json', 'dclab-web/yarn.lock') }}-

      - name: Install dependencies
        run: ${{ steps.package-manager.outputs.install }}

      - name: Build Next.js
        run: ${{ steps.package-manager.outputs.runner }} next build

      - name: Verify static export
        run: |
          if [ ! -d out ]; then
            echo "Build output folder 'out' was not created."
            echo "Check that next.config.js enables output: export."
            exit 1
          fi

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dclab-web/out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
